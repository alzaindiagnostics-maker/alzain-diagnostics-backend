spring.application.name=alzain-diagnostics-backend

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.embedded-database-connection=NONE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alzain}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false




# Active keep-alive ping to keep TCP sockets warm
spring.datasource.hikari.keepalive-time=60000

# Instantly spot queries/services holding connections too long
spring.datasource.hikari.leak-detection-threshold=10000
# ==========================================
# AL-ZAIN DIAGNOSTICS - PRODUCTION
# ==========================================

# ==========================================
# SERVER
# ==========================================

server.port=${PORT:8080}

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# INITIAL ADMIN
# ==========================================

admin.initial.username=${ADMIN_USERNAME:admin}
admin.initial.password=${ADMIN_PASSWORD}
admin.initial.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}

# ==========================================
# RESEND HTTP EMAIL API
# ==========================================
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
admin.notification.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}

# ==========================================
# FRONTEND URLS
# ==========================================

app.frontend.url=${FRONTEND_URL}
app.admin.frontend.url=${ADMIN_FRONTEND_URL}
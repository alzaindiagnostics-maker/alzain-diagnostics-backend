spring.application.name=alzain-diagnostics-backend

server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# INITIAL ADMIN
# ==========================================

admin.initial.username=${ADMIN_USERNAME:admin}
admin.initial.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}
admin.initial.password=${ADMIN_PASSWORD}

# ==========================================
# RESEND HTTP EMAIL API
# ==========================================
resend.api.key=${RESEND_API_KEY:re_dummyApiKeyForDevelopment}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
admin.notification.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}

# ==========================================
# FRONTEND
# ==========================================

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.admin.frontend.url=${ADMIN_FRONTEND_URL:http://localhost:5174}
# ==================================
# SERVER CONFIGURATION
# ==================================
server.port=8080

# ==================================
# DATABASE / SUPABASE (POOLER)
# Disable embedded H2 database auto-detection
spring.datasource.embedded-database-connection=NONE
# ==================================
# Use the IPv4 Session Pooler host to avoid SocketTimeoutException locally
spring.datasource.url=${DB_URL:jdbc:h2:mem:alzain_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ==================================
# JPA / HIBERNATE
# ==================================
# 'update' automatically updates database schema; use 'none' or 'validate' if using SQL migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================================
# SECURITY / JWT
# ==================================
jwt.secret=${JWT_SECRET:9a4f2c8d1e3b7a5f6e8d2c4b0a1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f}
jwt.expiration=86400000
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
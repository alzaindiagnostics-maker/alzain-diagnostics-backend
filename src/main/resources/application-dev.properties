# ==================================
# SERVER CONFIGURATION
# ==================================
server.port=${PORT:8080}

# ==================================
# DATABASE CONFIGURATION (POSTGRESQL)
# ==================================
# Disable embedded H2 database auto-detection completely
spring.datasource.embedded-database-connection=NONE

# Explicitly force PostgreSQL Driver and Render Env Variables
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ==================================
# JPA / HIBERNATE
# ==================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================================
# SECURITY / JWT
# ==================================
jwt.secret=${JWT_SECRET:9a4f2c8d1e3b7a5f6e8d2c4b0a1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f}
jwt.expiration=86400000

# ==================================
# EMAIL & FRONTEND
# ==================================
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.frontend.url=${FRONTEND_URL}
app.admin.frontend.url=${ADMIN_FRONTEND_URL}
spring.application.name=alzain-diagnostics-backend

server.port=${PORT:8080}
# Default to prod profile for Render deployment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.embedded-database-connection=NONE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# ==========================================
# JPA / HIBERNATE
# ==========================================
# Default to 'update' so Hibernate automatically creates missing tables on Supabase
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET:9a4f2c8d1e3b7a5f6e8d2c4b0a1f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# INITIAL ADMIN
# ==========================================
admin.initial.username=${ADMIN_USERNAME:admin}
admin.initial.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}
admin.initial.password=${ADMIN_PASSWORD:admin123}

# ==========================================
# EMAIL & FRONTEND
# ==========================================
resend.api.key=${RESEND_API_KEY:re_dummyApiKeyForDevelopment}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
admin.notification.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.admin.frontend.url=${ADMIN_FRONTEND_URL:http://localhost:5174}
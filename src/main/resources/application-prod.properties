# ==========================================
# AL-ZAIN DIAGNOSTICS - PRODUCTION CONFIG
# ==========================================

# SERVER
server.port=${PORT:8080}

# DATABASE
# Explicitly disable H2/Embedded database auto-detection
spring.datasource.embedded-database-connection=NONE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET:c42b89a2e1d0f5g6h7i8j9k0l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6b7c8d9e0}
jwt.expiration=${JWT_EXPIRATION:86400000}

# INITIAL ADMIN SETUP
admin.initial.username=${ADMIN_USERNAME:admin}
admin.initial.password=${ADMIN_PASSWORD:Admin@12345}
admin.initial.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}

# RESEND EMAIL SERVICE
resend.api.key=${RESEND_API_KEY:re_dummy_key}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
admin.notification.email=${ADMIN_EMAIL:alzaindiagnostics@gmail.com}

# FRONTEND CORS & REDIRECT URLS
app.frontend.url=${FRONTEND_URL:https://alzain-diagnostics-frontend.vercel.app}
app.admin.frontend.url=${ADMIN_FRONTEND_URL:https://alzain-diagnostics-admin.vercel.app}